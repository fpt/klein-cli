name: AI Code Review (klein)
description: >
  Runs `klein review` over a pull request. The summary lives in ONE sticky PR
  comment that is updated each round (inline comments + verdict are posted as
  a minimal review). Reviews are stateful: the sticky comment embeds the
  reviewed commit and a hash of the full PR diff; later runs review only the
  changes since then, an unchanged diff hash (e.g. a web-UI "Rebase branch" /
  "Update branch" push) skips the run entirely, a real force-push falls back
  to a full review, previous unresolved comments are fed back to the model,
  and threads it verifies as fixed are resolved. All GitHub interaction
  (gh/jq) happens here in the harness — klein itself never runs git or gh.

inputs:
  openai-api-key:
    description: API key for the openai backend (exported as OPENAI_API_KEY)
    required: false
    default: ""
  anthropic-api-key:
    description: API key for the anthropic backend (exported as ANTHROPIC_API_KEY)
    required: false
    default: ""
  gemini-api-key:
    description: API key for the gemini backend (exported as GEMINI_API_KEY)
    required: false
    default: ""
  backend:
    description: klein LLM backend (openai, anthropic, gemini)
    required: false
    default: openai
  model:
    description: Model override (empty = backend default)
    required: false
    default: ""
  language:
    description: Language for the review output (code or name, e.g. en, ja, Japanese)
    required: false
    default: en
  github-token:
    description: Token used to read the PR and post the review
    required: false
    default: ${{ github.token }}
  pr-number:
    description: Pull request number (default = current event's PR)
    required: false
    default: ${{ github.event.pull_request.number }}
  klein-path:
    description: Path to the klein binary
    required: false
    default: klein
  klein-version:
    description: >
      When set, install klein from the fpt/klein-cli release of that tag
      ("latest" = newest release, or e.g. "v0.1.1") instead of expecting a
      pre-built binary at klein-path. Downloads the klein_<os>_<arch>.tar.gz
      release asset; falls back to `go install` (requires Go on the runner)
      if the asset is missing.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Self-install for external consumers. This repo's own workflow builds
    # from source instead, to review unreleased changes.
    - name: Install klein
      if: inputs.klein-version != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        VERSION: ${{ inputs.klein-version }}
      run: |
        set -euo pipefail
        BIN_DIR="$RUNNER_TEMP/klein-bin"
        mkdir -p "$BIN_DIR"
        case "$(uname -m)" in
          x86_64)          ARCH=amd64 ;;
          aarch64 | arm64) ARCH=arm64 ;;
          *) echo "Unsupported arch $(uname -m)"; exit 1 ;;
        esac
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')   # linux | darwin
        ASSET="klein_${OS}_${ARCH}.tar.gz"
        TAG_ARGS=()
        if [ "$VERSION" != latest ]; then TAG_ARGS=("$VERSION"); fi
        if gh release download "${TAG_ARGS[@]}" -R fpt/klein-cli -p "$ASSET" -O "$RUNNER_TEMP/$ASSET"; then
          tar -C "$BIN_DIR" -xzf "$RUNNER_TEMP/$ASSET"
        else
          echo "::notice::Release asset $ASSET not found for $VERSION; falling back to go install"
          GOBIN="$BIN_DIR" go install "github.com/fpt/klein-cli/klein@$VERSION"
        fi
        echo "$BIN_DIR" >> "$GITHUB_PATH"
        "$BIN_DIR/klein" -h > /dev/null && echo "klein installed: $VERSION ($OS/$ARCH)"
    # Decide full vs incremental vs skip. State comes from the sticky summary
    # comment's klein-review-state marker: the last reviewed head commit plus
    # a sha256 of the full PR diff at that time.
    #   - diff hash unchanged  → skip: the content is identical, only history
    #     was rewritten (web-UI "Rebase branch" / "Update branch" pushes by
    #     the 'GitHub web flow' committer, or any other no-op force-push).
    #     The marker's head_sha is refreshed so the next real push still gets
    #     an incremental review.
    #   - last head an ancestor → incremental (git diff LAST..HEAD)
    #   - otherwise             → full (real force-push, or no state yet)
    - name: Determine review scope
      id: scope
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail
        HEAD_SHA=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
        gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" > /tmp/pr-full.diff
        DIFF_SHA=$(sha256sum /tmp/pr-full.diff | cut -d' ' -f1)

        # Sticky summary comment (authoritative marker home). Falls back to
        # review bodies for PRs reviewed before the sticky-comment scheme.
        # NB: with --paginate a --jq filter runs once PER PAGE, so page-level
        # `last` would emit one object per page; slurp all pages into a single
        # array first (each page is a JSON array; `add` flattens them).
        gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate 2>/dev/null \
          | jq -s 'add // []
                   | [.[] | select(.user.login == "github-actions[bot]")
                          | select(.body | contains("<!-- klein-review-state"))]
                   | last // empty' \
          > /tmp/sticky.json || true
        STICKY_ID=""
        STATE=""
        if [ -s /tmp/sticky.json ]; then
          STICKY_ID=$(jq -r .id /tmp/sticky.json)
          STATE=$(jq -r .body /tmp/sticky.json \
            | grep -o '<!-- klein-review-state {[^}]*} -->' | tail -1 || true)
        else
          STATE=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --paginate 2>/dev/null \
            | jq -rs 'add // [] | .[] | select(.user.login == "github-actions[bot]") | .body' \
            | grep -o '<!-- klein-review-state {[^}]*} -->' | tail -1 || true)
        fi
        LAST_SHA=$(printf '%s' "$STATE" | sed -n 's/.*"head_sha":"\([0-9a-f]*\)".*/\1/p')
        LAST_DIFF_SHA=$(printf '%s' "$STATE" | sed -n 's/.*"diff_sha":"\([0-9a-f]*\)".*/\1/p')
        LAST_TURN=$(printf '%s' "$STATE" | sed -n 's/.*"turn":\([0-9]*\).*/\1/p')
        LAST_TOTAL=$(printf '%s' "$STATE" | sed -n 's/.*"total":\([0-9]*\).*/\1/p')
        LAST_TURN=${LAST_TURN:-0}
        LAST_TOTAL=${LAST_TOTAL:-0}

        MODE=full
        if [ -n "$LAST_SHA" ]; then
          if [ "$LAST_SHA" = "$HEAD_SHA" ]; then
            echo "::notice::Head $HEAD_SHA already reviewed; skipping"
            MODE=skip
          elif [ -n "$LAST_DIFF_SHA" ] && [ "$LAST_DIFF_SHA" = "$DIFF_SHA" ]; then
            echo "::notice::PR diff unchanged since last review (rebase/update without content changes); skipping"
            MODE=skip
            # Refresh the marker's head_sha so the next content push can be
            # reviewed incrementally from this (rewritten) head. turn/total
            # are carried over unchanged — no review happened.
            if [ -n "$STICKY_ID" ]; then
              NEW_MARKER="<!-- klein-review-state {\"head_sha\":\"$HEAD_SHA\",\"diff_sha\":\"$DIFF_SHA\",\"turn\":$LAST_TURN,\"total\":$LAST_TOTAL} -->"
              jq -r .body /tmp/sticky.json \
                | sed "s|<!-- klein-review-state {[^}]*} -->|$NEW_MARKER|" > /tmp/sticky-body.txt
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$STICKY_ID" \
                -F body=@/tmp/sticky-body.txt > /dev/null
              echo "Marker refreshed to $HEAD_SHA"
            fi
          elif git cat-file -e "$LAST_SHA^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$LAST_SHA" "$HEAD_SHA" 2>/dev/null; then
            MODE=incremental
          else
            echo "::notice::Last reviewed commit $LAST_SHA rewritten (force-push); running full review"
          fi
        fi

        if [ "$MODE" = incremental ]; then
          git diff "$LAST_SHA".."$HEAD_SHA" > /tmp/pr-incremental.diff
          if [ ! -s /tmp/pr-incremental.diff ]; then
            echo "::notice::No changes since last review; skipping"
            MODE=skip
          fi
        fi

        echo "Review mode: $MODE (head=$HEAD_SHA last=${LAST_SHA:-none} turn=$((LAST_TURN + 1)))"
        {
          echo "mode=$MODE"
          echo "head_sha=$HEAD_SHA"
          echo "diff_sha=$DIFF_SHA"
          echo "sticky_id=$STICKY_ID"
          echo "turn=$((LAST_TURN + 1))"
          echo "prev_total=$LAST_TOTAL"
        } >> "$GITHUB_OUTPUT"

    # Unresolved inline threads from earlier bot reviews, as
    # [{id, path, line, body}] — id is the GraphQL thread id used to resolve.
    - name: Collect previous review comments
      if: steps.scope.outputs.mode != 'skip'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail
        gh api graphql \
          -f query='query($owner: String!, $repo: String!, $pr: Int!) {
            repository(owner: $owner, name: $repo) {
              pullRequest(number: $pr) {
                reviewThreads(first: 100) {
                  nodes {
                    id isResolved path line originalLine
                    comments(first: 1) { nodes { author { login } body } }
                  }
                }
              }
            }
          }' \
          -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" -F pr="$PR" \
          --jq '[.data.repository.pullRequest.reviewThreads.nodes[]
                 | select(.isResolved | not)
                 | select(.comments.nodes[0].author.login == "github-actions")
                 | {id, path, line: (.line // .originalLine // 0), body: .comments.nodes[0].body}]' \
          > /tmp/previous-comments.json
        echo "Previous unresolved bot comments: $(jq length /tmp/previous-comments.json)"

    - name: Build review request
      if: steps.scope.outputs.mode != 'skip'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ inputs.pr-number }}
        MODE: ${{ steps.scope.outputs.mode }}
      run: |
        set -euo pipefail
        gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body > /tmp/pr-meta.json

        if [ "$MODE" = incremental ]; then
          jq --rawfile diff /tmp/pr-incremental.diff --rawfile full /tmp/pr-full.diff \
             --slurpfile prev /tmp/previous-comments.json \
            '{title: .title, body: (.body // ""), diff: $diff, full_diff: $full,
              mode: "incremental", previous_comments: $prev[0]}' \
            /tmp/pr-meta.json > /tmp/review-request.json
        else
          jq --rawfile diff /tmp/pr-full.diff --slurpfile prev /tmp/previous-comments.json \
            '{title: .title, body: (.body // ""), diff: $diff,
              mode: "full", previous_comments: $prev[0]}' \
            /tmp/pr-meta.json > /tmp/review-request.json
        fi

    - name: Run klein review
      if: steps.scope.outputs.mode != 'skip'
      shell: bash
      env:
        # Inputs land under INPUT_* names and are exported only when set, so an
        # empty input never clobbers a key provided via the caller's job env.
        INPUT_OPENAI_KEY: ${{ inputs.openai-api-key }}
        INPUT_ANTHROPIC_KEY: ${{ inputs.anthropic-api-key }}
        INPUT_GEMINI_KEY: ${{ inputs.gemini-api-key }}
      run: |
        set -euo pipefail
        if [ -n "$INPUT_OPENAI_KEY" ]; then export OPENAI_API_KEY="$INPUT_OPENAI_KEY"; fi
        if [ -n "$INPUT_ANTHROPIC_KEY" ]; then export ANTHROPIC_API_KEY="$INPUT_ANTHROPIC_KEY"; fi
        if [ -n "$INPUT_GEMINI_KEY" ]; then export GEMINI_API_KEY="$INPUT_GEMINI_KEY"; fi
        MODEL_ARGS=()
        if [ -n "${{ inputs.model }}" ]; then
          MODEL_ARGS=(-m "${{ inputs.model }}")
        fi
        "${{ inputs.klein-path }}" review \
          -b "${{ inputs.backend }}" "${MODEL_ARGS[@]}" \
          --language "${{ inputs.language }}" \
          --input /tmp/review-request.json \
          --output /tmp/review-result.json \
          --workdir "$GITHUB_WORKSPACE"
        jq . /tmp/review-result.json

    # Sticky summary comment (created once, updated every round) + a minimal
    # review carrying only the inline comments and the verdict event.
    - name: Post review result
      if: steps.scope.outputs.mode != 'skip'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ inputs.pr-number }}
        MODE: ${{ steps.scope.outputs.mode }}
        HEAD_SHA: ${{ steps.scope.outputs.head_sha }}
        DIFF_SHA: ${{ steps.scope.outputs.diff_sha }}
        STICKY_ID: ${{ steps.scope.outputs.sticky_id }}
        TURN: ${{ steps.scope.outputs.turn }}
        PREV_TOTAL: ${{ steps.scope.outputs.prev_total }}
      run: |
        set -euo pipefail

        # Resolve threads the model verified as fixed. Best-effort: a failed
        # mutation must not block posting the review itself.
        jq -r '.resolved[]?.id' /tmp/review-result.json | while read -r THREAD_ID; do
          if gh api graphql \
              -f query='mutation($id: ID!) {
                resolveReviewThread(input: {threadId: $id}) { thread { id isResolved } }
              }' \
              -f id="$THREAD_ID" > /dev/null; then
            echo "Resolved thread $THREAD_ID"
          else
            echo "::warning::Failed to resolve thread $THREAD_ID"
          fi
        done

        # --- Sticky summary comment: update in place, or create on round 1.
        # The klein-review-state marker records the reviewed head commit, the
        # full-diff hash, the turn number, and the cumulative comment count.
        # Stats: total = all comments ever posted; active = still-unresolved
        # previous comments (minus this round's resolutions) plus new ones.
        N_NEW=$(jq '.comments | length' /tmp/review-result.json)
        N_RESOLVED=$(jq '(.resolved // []) | length' /tmp/review-result.json)
        PREV_UNRESOLVED=$(jq length /tmp/previous-comments.json)
        TOTAL=$((PREV_TOTAL + N_NEW))
        ACTIVE=$((PREV_UNRESOLVED - N_RESOLVED + N_NEW))

        jq -r --arg mode "$MODE" --arg head "$HEAD_SHA" --arg diff "$DIFF_SHA" \
              --arg turn "$TURN" --arg total "$TOTAL" --arg active "$ACTIVE" \
              --arg nnew "$N_NEW" --arg nresolved "$N_RESOLVED" '
          "## 🤖 AI Review (klein) — turn " + $turn + "\n\n"
          + .summary
          + "\n\n---\n_turn " + $turn + " (" + $mode + " review of " + ($head[0:7]) + ") · "
          + "comments: total " + $total + ", active " + $active
          + " (+" + $nnew + " new, −" + $nresolved + " resolved) · verdict: " + .verdict + "_"
          + "\n\n<!-- klein-review-state {\"head_sha\":\"" + $head + "\",\"diff_sha\":\"" + $diff
          + "\",\"turn\":" + $turn + ",\"total\":" + $total + "} -->"
        ' /tmp/review-result.json > /tmp/summary-body.txt

        if [ -n "$STICKY_ID" ]; then
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$STICKY_ID" \
            -F body=@/tmp/summary-body.txt > /dev/null
          echo "Updated sticky summary comment $STICKY_ID"
        else
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            -F body=@/tmp/summary-body.txt --jq .id
        fi

        # --- Minimal review: inline comments + verdict event only. Skipped
        # when there is nothing to attach and no review state to set.
        EVENT=$(jq -r '{approve: "APPROVE", request_changes: "REQUEST_CHANGES"}[.verdict] // "COMMENT"' /tmp/review-result.json)
        N_COMMENTS=$(jq '.comments | length' /tmp/review-result.json)
        if [ "$N_COMMENTS" -eq 0 ] && [ "$EVENT" = "COMMENT" ]; then
          echo "No inline comments and neutral verdict — summary comment only"
          exit 0
        fi

        jq --arg event "$EVENT" '{
          body: "_klein AI review — details in the summary comment._",
          event: $event,
          comments: [ .comments[] | {
            path: .path,
            side: "RIGHT",
            body: ((if (.severity // "") != "" then "**[" + .severity + "]** " else "" end) + .body)
          } + (if (.end_line // .line) > .line
               then {start_line: .line, start_side: "RIGHT", line: .end_line}
               else {line: .line} end) ]
        }' /tmp/review-result.json > /tmp/review-payload.json

        post() {
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --method POST --input "$1"
        }

        if ! post /tmp/review-payload.json; then
          echo "::warning::Posting the review failed; retrying without inline comments"
          jq '{body: .body, event: "COMMENT"}' /tmp/review-payload.json > /tmp/review-minimal.json
          post /tmp/review-minimal.json
        fi
