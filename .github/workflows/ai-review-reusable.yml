# Reusable AI-review workflow for OTHER repositories. Call it with:
#
#   name: AI Review
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]
#   permissions:
#     contents: write        # required by resolveReviewThread; see below
#     pull-requests: write
#   jobs:
#     review:
#       if: github.event.pull_request.head.repo.full_name == github.repository
#       uses: fpt/klein-cli/.github/workflows/ai-review-reusable.yml@main
#       with:
#         language: ja            # optional
#         klein-version: v0.1.1   # optional, default: latest release
#       secrets:
#         openai-api-key: ${{ secrets.OPENAI_API_KEY }}
#
# (Pin @main or a tag — GitHub Actions has no @latest ref. The klein binary
# itself is installed from the released version via the Go module proxy.)
#
# Permissions are inherited from the caller — a reusable workflow can only
# narrow them — so the caller has to grant the ceiling. `contents: write` looks
# heavier than it is: nothing here writes to your repository. It is simply what
# GitHub gates the `resolveReviewThread` mutation on, and under `contents: read`
# that call fails with "Resource not accessible by integration", leaving threads
# the reviewer verified as fixed open forever (fpt/klein-cli#111).
#
# The scope is then kept away from your code. This workflow narrows the `review`
# job — the one that checks out your PR head and runs a model over it — back to
# `contents: read`, and does the mutation in a second job that checks nothing
# out. No job ever holds both a repo-write token and PR-authored code.
name: AI Review (reusable)

on:
  workflow_call:
    inputs:
      backend:
        description: klein LLM backend (openai, anthropic, gemini)
        type: string
        required: false
        default: openai
      model:
        description: Model override (empty = backend default)
        type: string
        required: false
        default: ""
      effort:
        description: Reasoning effort (none|minimal|low|medium|high|xhigh; empty = backend default)
        type: string
        required: false
        default: ""
      max-turns:
        description: Maximum agent iterations (0/empty = default)
        type: string
        required: false
        default: ""
      max-budget-tokens:
        description: Cumulative token budget; exceeding it stops the review keeping comments so far (0/empty = unlimited)
        type: string
        required: false
        default: ""
      max-comments:
        description: Cap on inline comments; excess trimmed lowest-severity-first (empty = 15, 0 = unlimited)
        type: string
        required: false
        default: ""
      language:
        description: Language for the review output (e.g. en, ja)
        type: string
        required: false
        default: en
      klein-version:
        description: klein release to install via `go install` (e.g. latest, v0.1.1)
        type: string
        required: false
        default: latest
    secrets:
      openai-api-key:
        required: false
      anthropic-api-key:
        required: false
      gemini-api-key:
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    # Skip draft PRs; the review runs once the PR is marked ready for review.
    # Add `ready_for_review` to the caller's trigger types so this fires then.
    if: github.event.pull_request.draft == false
    # Runs your PR's code — narrowed away from the caller's contents: write.
    permissions:
      contents: read
      pull-requests: write
    outputs:
      mode: ${{ steps.review.outputs.mode }}
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history: the action detects force-pushes with merge-base and
          # builds the incremental diff from the last reviewed commit.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: AI review
        id: review
        uses: fpt/klein-cli/.github/actions/ai-review@main
        with:
          backend: ${{ inputs.backend }}
          model: ${{ inputs.model }}
          effort: ${{ inputs.effort }}
          max-turns: ${{ inputs.max-turns }}
          max-budget-tokens: ${{ inputs.max-budget-tokens }}
          max-comments: ${{ inputs.max-comments }}
          language: ${{ inputs.language }}
          klein-version: ${{ inputs.klein-version }}
          openai-api-key: ${{ secrets.openai-api-key }}
          anthropic-api-key: ${{ secrets.anthropic-api-key }}
          gemini-api-key: ${{ secrets.gemini-api-key }}

  # Mutation-only, and deliberately trivial: no checkout, no build, no model.
  # This is the only job holding contents: write, and nothing from your PR ever
  # runs on its runner. Inline rather than a composite action — a local action
  # would need a checkout, which is the thing being avoided.
  resolve:
    needs: review
    if: needs.review.result == 'success' && needs.review.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # what resolveReviewThread actually requires
      pull-requests: write
    steps:
      - name: Download review result
        uses: actions/download-artifact@v4
        with:
          name: klein-review-result

      - name: Resolve verified-fixed threads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OK=0 FAILED=0
          while read -r THREAD_ID; do
            [ -n "$THREAD_ID" ] || continue
            if gh api graphql \
                -f query='mutation($id: ID!) {
                  resolveReviewThread(input: {threadId: $id}) { thread { id isResolved } }
                }' \
                -f id="$THREAD_ID" > /dev/null; then
              echo "Resolved thread $THREAD_ID"
              OK=$((OK + 1))
            else
              echo "::error::Failed to resolve thread $THREAD_ID"
              FAILED=$((FAILED + 1))
            fi
          done < <(jq -r '.resolved[]?.id' review-result.json)

          echo "Resolved $OK thread(s), $FAILED failure(s)"
          # Fail loudly. A silent warning here is exactly what let #111 go
          # unnoticed: the summary comment claimed threads were resolved while
          # every mutation was being rejected.
          [ "$FAILED" -eq 0 ]
